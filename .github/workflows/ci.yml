name: Task Manger API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: set up node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 25
          cache: npm
      
      - name: install dependencies
        run: npm ci

      - name: run test
        run : npm test
