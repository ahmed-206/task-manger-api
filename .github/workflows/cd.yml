name: Task Manger API CD

on:
  workflow_run:
    workflows: ['Task Manger API CI']
    types:
        - completed
    branches: 
        - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
    vercel_deploy:
        name: Vercel deploy
        if: >
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest

        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{secrets.VERCEL_PROJECT_ID}}
            API_URL: https://task-manager-2msvsnmjs-ahmed-206s-projects.vercel.app
            VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
            with:
                ref: ${{ github.event.workflow_run.head_sha }}

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 25
           
            #install vercel CLI on server
          - name: Install Vercel CLI
            run: npm install --global vercel@latest

            #ask vercel the project info & settings
          - name: Pull Vercel Environment Information
            run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
            # prepare the the product app
          - name: Build Project Artifacts
            run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
            # deploy to vercel
          - name: Deploy to Vercel
            run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          - name: Smoke Test
            run: | 
              echo "Test production API..."

              response=$(curl --fail --show-error --silent \
                --retry 3 \
                --retry-delay 2 \
                --retry-connrefused \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$API_URL/api/health")
              
              echo "API Response: $response"

              export RESPONSE="$response"

              node <<'NODE'
              const data = JSON.parse(process.env.RESPONSE);

              if (data.status !== "ok") {
                console.error("Health check failed!");
                process.exit(1);
              }

              if (data.message !== "Task Manager API is running") {
                console.error("Unexpected API response!");
                process.exit(1);
              }

              console.log("Smoke test passed!");
              NODE
              